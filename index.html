<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#829c7f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>병현이의 긍정카드</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>
:root{--bg:#f8f3ea;--ink:#493c32;--muted:#81786e;--green:#829c7f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}main{max-width:520px;margin:auto;min-height:100dvh;padding:24px 20px 44px}.top{display:flex;align-items:start;justify-content:space-between;gap:12px}.top h1{font-size:25px;margin:0 0 7px;letter-spacing:-.8px}.top p{margin:0;color:var(--muted);font-size:14px}.gear{border:0;background:#eee5d8;border-radius:50%;width:48px;height:48px;font-size:22px;color:var(--ink)}.hero{margin-top:34px;text-align:center}.hero img{width:min(100%,340px);aspect-ratio:4/3;object-fit:cover;border-radius:25px;box-shadow:0 9px 25px #6e584e19}.hero h2{font-size:clamp(25px,6vw,33px);line-height:1.45;margin:26px 0}.hero p{font-size:17px;color:var(--muted);line-height:1.85}.primary{border:0;border-radius:100px;background:var(--green);color:white;font-size:18px;font-weight:800;padding:20px 18px;width:100%;margin-top:25px;box-shadow:0 8px 20px #667c6129;cursor:pointer}.primary:active{transform:scale(.985)}.card{margin-top:28px;background:#fffaf1;border-radius:30px;overflow:hidden;box-shadow:0 12px 28px #695d4c18;opacity:1;transition:opacity .22s ease,transform .22s ease}.card.hide{opacity:0;transform:translateY(8px)}.card img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.inside{padding:23px 23px 26px}.meta{text-align:center;color:var(--green);font-size:13px;font-weight:700;letter-spacing:1px}.inside h2{text-align:center;font-size:23px;line-height:1.5;letter-spacing:-.7px;margin:16px 0 20px}.body{white-space:pre-line;line-height:1.95;color:#645a50;font-size:15px}.music{margin-top:24px;padding-top:18px;border-top:1px solid #e9dfcf;display:flex;gap:12px;align-items:center}.note{font-size:27px}.music small{color:var(--muted)}.music strong{display:block;font-size:15px}.music span{font-size:13px;color:var(--muted)}.music a{margin-left:auto;border-radius:22px;padding:10px 13px;background:#f0e7d7;color:#55483d;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}.hint{text-align:center;font-size:12px;color:#978b80;margin-top:17px}.dialog{position:fixed;inset:0;background:#332d286e;display:none;align-items:center;justify-content:center;padding:20px;z-index:3}.dialog.open{display:flex}.panel{background:#fffaf1;border-radius:24px;padding:24px;width:min(100%,420px)}.panel h2{margin:0 0 10px}.panel p{color:var(--muted);font-size:14px}.panel label{display:block;font-weight:700;margin:18px 0 8px}.panel input{width:100%;padding:14px;border:1px solid #c9bdb0;border-radius:12px;font-size:17px;background:white}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;border:0;padding:14px;border-radius:12px;font-size:15px}.save{background:var(--green);color:white}.cancel{background:#ece4d9;color:var(--ink)}.offline{display:none;text-align:center;color:#a44e47;font-size:14px;margin:16px 0}@media(prefers-reduced-motion:reduce){.card{transition:none}.primary:active{transform:none}}
</style></head><body><main><header class="top"><div><h1 id="appTitle">병현이의 긍정카드</h1><p>오늘도, 조금 더 괜찮은 너에게</p></div><button class="gear" id="settings" aria-label="이름 변경">⚙</button></header><div id="offline" class="offline">인터넷 연결이 필요합니다. 연결 후 새로고침해 주세요.</div><section id="welcome" class="hero"><img src="./images/001.svg" alt="빨간 스카프를 두른 귀여운 흰 진돗개 자수 그림"><h2 id="welcomeTitle">병현아, 오늘은 어떤 말이 기다릴까?</h2><p>작은 자수 한 땀처럼<br>마음에 남을 응원 한 장을 뽑아봐.</p><button id="first" class="primary">첫 카드 뽑기</button></section><section id="result" hidden><article id="card" class="card" aria-live="polite"><img id="cardImage" alt="귀여운 흰 진돗개가 등장하는 자수풍 풍경"><div class="inside"><div class="meta" id="meta"></div><h2 id="cardTitle"></h2><div id="cardBody" class="body"></div><div class="music"><div class="note">♫</div><div><small>오늘의 BGM</small><strong id="song"></strong><span id="artist"></span></div><a id="listen" target="_blank" rel="noopener noreferrer">YouTube 듣기 ↗</a></div></div></article><button id="again" class="primary">↝ 다른 카드 뽑기</button><p class="hint">중복 허용 · 언제든 다시 뽑을 수 있어</p></section></main><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="panel"><h2 id="dialogTitle">이름 변경</h2><p>선물할 사람의 이름으로도 바꿀 수 있어요.</p><label for="name">받는 사람 이름</label><input id="name" maxlength="20" placeholder="예: 병현" autocomplete="off"><div class="actions"><button id="cancel" class="cancel">취소</button><button id="save" class="save">적용하기</button></div></div></div><script src="./script.js" defer></script></body></html>
